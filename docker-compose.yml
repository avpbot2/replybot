services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-root-password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-replybot}
      MYSQL_USER: ${MYSQL_USER:-replybot}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-this-password}
    ports:
      - "3306:3306"
    volumes:
      - replybot_mysql:/var/lib/mysql
      - ./apps/api/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD:-local-root-password}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  replybot_mysql:
